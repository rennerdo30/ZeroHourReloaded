[workspace]
resolver = "3"
members = [
    "rust/zhr-core",
    "rust/zhr-vulkan",
    "rust/zhr-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-or-later"
repository = "https://github.com/rennerdo30/ZeroHourReloaded"

[workspace.dependencies]
zhr-core = { path = "rust/zhr-core" }
zhr-vulkan = { path = "rust/zhr-vulkan" }
zhr-ffi = { path = "rust/zhr-ffi" }

ash = "0.38"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
log = "0.4"
naga = { version = "30", default-features = false, features = ["wgsl-in", "spv-out"] }
png = "0.18"
raw-window-handle = "0.6"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Fast iteration:
# - Workspace crates keep incremental builds + compact line-table debug info for fast relinking.
# - Third-party dependencies compile once at opt-level 2 without debug info and are cached by sccache.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

# Fast local release build without thin-LTO/codegen-units=1 overhead.
[profile.release-fast]
inherits = "release"
lto = "off"
codegen-units = 16
strip = "none"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
